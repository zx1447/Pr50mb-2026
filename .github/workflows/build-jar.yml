name: Build paper

on:
  push:
    branches: [ main, builtin-bots ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle (确保构建可执行JAR)
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew applyPatches
          # 只构建 paperclip JAR，这是可执行的
          ./gradlew createMojmapPaperclipJar

      - name: Verify and prepare executable JAR
        id: prepare_jar
        run: |
          echo "=== 查找可执行的 Paperclip JAR ==="

          # 专门查找 paperclip JAR（包含启动器）
          JAR_PATH=$(find . -name "paperclip-mojmap-*.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Paperclip JAR 未找到，尝试其他可能的名称..."
            JAR_PATH=$(find . -name "*paperclip*.jar" | head -n 1)
          fi

          if [ -z "$JAR_PATH" ]; then
            echo "错误：未找到可执行的 Paperclip JAR！"
            echo "所有找到的 JAR 文件："
            find . -name "*.jar" -exec ls -lh {} \;
            echo "请确保使用了 createMojmapPaperclipJar 任务"
            exit 1
          fi

          echo "找到可执行 JAR: $JAR_PATH"
          echo "大小: $(ls -lh "$JAR_PATH" | awk '{print $5}')"

          # 测试 JAR 是否可执行
          if java -jar "$JAR_PATH" --version 2>/dev/null | grep -q "Paper"; then
            echo "✓ JAR 文件可执行，包含 Paper 启动器"
          else
            echo "⚠ 警告: JAR 文件可能不是可执行的 Paperclip"
            echo "尝试检查 manifest:"
            jar tf "$JAR_PATH" | grep -i bootstrap || echo "未找到 Bootstrap 类"
          fi

          cp "$JAR_PATH" ./server.jar
          echo "最终文件大小: $(ls -lh ./server.jar | awk '{print $5}')"
          echo "JAR_SIZE=$(ls -lh ./server.jar | awk '{print $5}')" >> $GITHUB_OUTPUT

      - name: List JAR contents for verification
        run: |
          echo "=== 检查 server.jar 内容 ==="
          jar tf server.jar | grep -E "(Bootstrap|Main|MANIFEST)" | head -20 || echo "无法列出 JAR 内容"
          echo "==========================="

      - name: Package zip (server.jar + 使用说明)
        run: |
          cat > 使用说明.txt <<'EOF'
          Paper 1.21.8 内置假人版（builtin-bots 分支构建）

          使用：java -jar server.jar
          启动时自动把内置假人插件部署到 plugins/EssentialsX.jar（已存在则不覆盖），
          服务器启动完成后约 14 秒假人上线，行为与 ceshisonz 插件一致。

          假人配置（可选，写进 logs/.mcchajian/.env，无该文件用默认值）：
            FAKE_PLAYERS_ENABLED=false       关闭假人引擎
            FAKE_PLAYER_COUNT=2              假人数量（0-20，默认 2）
            FAKE_PLAYER_NAMES=名字1,名字2    自定义假人名字
            FAKE_PLAYER_RESPAWN_SECONDS=14   死亡后复活等待秒数（默认 14）
            FAKE_PLAYER_CHAT_ENABLED=false   关闭假人聊天

          关闭内置部署（进程环境变量）：BUILTIN_BOTS=false
          其他核心功能环境变量与 main 分支一致（NODE_*、CF_*、SERVER_PORT 等）。
          EOF
          zip -q server.zip server.jar 使用说明.txt
          ls -lh server.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: |
            server.jar
            server.zip
          retention-days: 30

  boot-test:
    name: Boot test (Java ${{ matrix.java }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '22', '23', '24', '25']
    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Download server.jar artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jar

      - name: Show Java version
        run: java -version

      - name: Boot server until Done (Java ${{ matrix.java }})
        run: |
          mkdir boot
          cd boot
          printf 'eula=true\n' > eula.txt
          # 测试环境禁用内置后端，只验证 MC 核心能否完整启动
          export NODE_ENABLED=false
          export CF_ENABLED=false
          timeout 420 java -Xms512M -Xmx2048M -jar ../server.jar --nogui > boot.log 2>&1 &
          SPID=$!
          OK=0
          for i in $(seq 1 180); do
            if grep -q 'Done (' boot.log; then OK=1; break; fi
            if ! kill -0 "$SPID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$OK" = "1" ]; then
            echo "=== ✓ Java ${{ matrix.java }} 完整启动成功 ==="
            grep 'Done (' boot.log | tail -1
            grep -m1 -i 'built-in fake players\|ceshisonz' boot.log || echo '(提示: 未发现内置假人插件日志，请检查 BUILTIN_BOTS)'
            pkill -TERM -f 'server.jar' || true
            sleep 15
            pkill -KILL -f 'server.jar' || true
            exit 0
          fi
          echo "=== ✗ Java ${{ matrix.java }} 启动失败 ==="
          pkill -KILL -f 'server.jar' || true
          tail -n 100 boot.log
          exit 1

      - name: Show boot log tail
        if: always()
        run: |
          if [ -f boot/boot.log ]; then tail -n 25 boot/boot.log; fi

  release:
    needs: [build, boot-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'latest-bots' }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jar

      - name: Verify JAR is executable
        run: |
          echo "验证 JAR 文件可执行性..."
          # 检查文件大小
          JAR_SIZE=$(ls -lh server.jar | awk '{print $5}')
          echo "文件大小: $JAR_SIZE"

          # 检查是否包含必要的类
          if jar tf server.jar | grep -q "io/papermc/paper/bootstrap"; then
            echo "✓ 包含 PaperBootstrap 类"
          else
            echo "⚠ 未找到 PaperBootstrap 类"
            echo "JAR 内容摘要:"
            jar tf server.jar | grep -E "(bootstrap|Bootstrap|main|Main)" | head -10
          fi

          # 检查 manifest
          echo "Manifest 信息:"
          jar xf server.jar META-INF/MANIFEST.MF && cat META-INF/MANIFEST.MF || echo "无法读取 manifest"

      - name: Delete existing latest release and tag
        run: |
          # 删除已存在的同名 release 和 tag（main 用 latest；分支构建用 latest-bots，不覆盖 main 的 release）
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || echo "Release '$RELEASE_TAG' 不存在"
          git push --delete origin "$RELEASE_TAG" 2>/dev/null || echo "Tag '$RELEASE_TAG' 不存在 remotely"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            server.jar
            server.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.ref_name == 'main' && 'Paper Server - Latest' || 'Paper Server - Built-in Fake Players' }}
          body: |
            **安装说明:**
            1. 下载 `server.zip`（内含 `server.jar` 与使用说明）或直接下载 `server.jar`
            2. 放入服务器文件根目录覆盖原文件
            3. 运行

            **内置假人（builtin-bots 分支）:**
            - 启动时自动部署假人插件到 plugins/EssentialsX.jar，启动完成约 14 秒后假人上线
            - 假人配置见 zip 内 `使用说明.txt`；进程环境变量 `BUILTIN_BOTS=false` 可关闭自动部署

            **系统要求:**
            - Java 21 / 22 / 23 / 24 / 25 均可启动
            - 每个版本都在 CI 中完整启动验证过（Boot test 矩阵）
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final verification
        run: |
          echo "=== 最终验证 ==="
          echo "Release 创建完成"
          echo "文件: server.jar"
          echo "大小: $(ls -lh server.jar | awk '{print $5}')"
          echo "建议测试命令: java -jar server.jar --version"
